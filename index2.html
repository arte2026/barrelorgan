<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Barrel Organ Keyboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Play the Barrel Organ</h1>

<h1>Toca el Organillo</h1>

<div class="keyboard-container">
    <div class="keyboard">

        <button
                class="white-key"
                data-note="C4"
                type="button">

            <span>C</span>

        </button>

        <button
                class="white-key"
                data-note="D4"
                type="button">

            <span>D</span>

        </button>

        <button
                class="white-key"
                data-note="E4"
                type="button">

            <span>E</span>

        </button>

        <button
                class="white-key"
                data-note="F4"
                type="button">

            <span>F</span>

        </button>

        <button
                class="white-key"
                data-note="G4"
                type="button">

            <span>G</span>

        </button>

        <button
                class="white-key"
                data-note="A4"
                type="button">

            <span>A</span>

        </button>

        <button
                class="white-key"
                data-note="B4"
                type="button">

            <span>B</span>

        </button>

        <button
                class="black-key black-c"
                data-note="C#4"
                type="button">

            C#

        </button>

        <button
                class="black-key black-d"
                data-note="D#4"
                type="button">

            D#

        </button>

        <button
                class="black-key black-f"
                data-note="F#4"
                type="button">

            F#

        </button>

        <button
                class="black-key black-g"
                data-note="G#4"
                type="button">

            G#

        </button>

        <button
                class="black-key black-a"
                data-note="A#4"
                type="button">

            A#

        </button>

    </div>

</div>

<div class="bottom-bar">

            <button class="btn"  onclick="goBack()"
 >Atras / Back</button>

        </div>

    <script src="samples.js"></script>
    <script src="teclado.js" > </script>
</body>
</html>
